---
layout: default
---
<main class="sheet">
  <header>
    <p class="eyebrow">{% include icon.html name="tag" %}Tag</p>
    <h1>{{ page.tag }}</h1>
  </header>
  {%- assign posts = site.tags[page.tag] %}
  {%- if posts %}
  <ul class="post-list">
    {%- for post in posts %}
    <li><a href="{{ post.url }}">{{ post.title }}</a><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %Y" }}</time></li>
    {%- endfor %}
  </ul>
  {%- else %}
  <p class="empty">There are no posts for this tag.</p>
  {%- endif %}
</main>
