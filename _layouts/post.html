---
layout: default
---
<main class="sheet post">
  <header>
    <h1>{{ page.title }}</h1>
    <p class="meta">
      <span>{% include icon.html name="calendar" %}<time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></span>
    </p>
  </header>
  <article class="prose">
    {{ content }}
  </article>
</main>
